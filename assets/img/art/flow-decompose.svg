<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="t-decompose">
  <title id="t-decompose">하나의 요청이 다섯 개의 실행 단위로 분해되고 다시 하나의 검증 기록으로 수렴하는 구조도</title>
  <defs>
    <linearGradient id="dc-champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EBD2"/>
      <stop offset="0.45" stop-color="#E0CB9C"/>
      <stop offset="1" stop-color="#BCA068"/>
    </linearGradient>
    <linearGradient id="dc-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#242220"/>
      <stop offset="1" stop-color="#1B1A18"/>
    </linearGradient>
    <radialGradient id="dc-glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#D6BE88" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#D6BE88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dc-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="880" height="520" rx="22" fill="url(#dc-bg)"/>
  <rect width="880" height="520" rx="22" fill="url(#dc-grid)"/>
  <rect width="880" height="520" rx="22" fill="url(#dc-glow)"/>
  <rect x="0.5" y="0.5" width="879" height="519" rx="22" fill="none" stroke="#4E4A45" stroke-opacity="0.7"/>

  <!-- one request -->
  <g>
    <rect x="48" y="214" width="188" height="92" rx="16" fill="#262422" stroke="#4E4A45"/>
    <path d="M70 248l12 12-12 12M90 272h18" fill="none" stroke="url(#dc-champagne)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="232" width="52" height="7" rx="3.5" fill="#CBB283" fill-opacity="0.85"/>
    <rect x="130" y="232" width="84" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="124" y="268" width="90" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.16"/>
  </g>

  <!-- fan-out connectors -->
  <g fill="none" stroke="#CBB283" stroke-opacity="0.42" stroke-width="1.6">
    <path d="M236 260C300 260 300 96 368 96"/>
    <path d="M236 260C300 260 300 178 368 178"/>
    <path d="M236 260H368"/>
    <path d="M236 260C300 260 300 342 368 342"/>
    <path d="M236 260C300 260 300 424 368 424"/>
  </g>
  <g fill="#CBB283">
    <circle cx="236" cy="260" r="5"/>
  </g>

  <!-- five work units -->
  <g>
    <rect x="368" y="66" width="214" height="60" rx="13" fill="#2D2A28" stroke="#5FA97A" stroke-opacity="0.55"/>
    <circle cx="394" cy="96" r="7" fill="#7CC49A"/>
    <path d="M391 96l2.6 2.8 5-5.4" fill="none" stroke="#1B1A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="412" y="85" width="72" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="412" y="100" width="118" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.16"/>
  </g>
  <g>
    <rect x="368" y="148" width="214" height="60" rx="13" fill="#2D2A28" stroke="#5FA97A" stroke-opacity="0.55"/>
    <circle cx="394" cy="178" r="7" fill="#7CC49A"/>
    <path d="M391 178l2.6 2.8 5-5.4" fill="none" stroke="#1B1A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="412" y="167" width="88" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="412" y="182" width="102" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.16"/>
  </g>
  <g>
    <rect x="368" y="230" width="214" height="60" rx="13" fill="#302C24" stroke="#CBB283" stroke-opacity="0.75"/>
    <circle cx="394" cy="260" r="7" fill="none" stroke="#F4B223" stroke-width="2.4"/>
    <circle cx="394" cy="260" r="2.4" fill="#F4B223"/>
    <rect x="412" y="249" width="64" height="7" rx="3.5" fill="#F0E4C8" fill-opacity="0.8"/>
    <rect x="412" y="264" width="124" height="6" rx="3" fill="#CBB283" fill-opacity="0.3"/>
  </g>
  <g>
    <rect x="368" y="312" width="214" height="60" rx="13" fill="#262422" stroke="#4E4A45"/>
    <circle cx="394" cy="342" r="7" fill="none" stroke="#C6A96A" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="412" y="331" width="58" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.34"/>
    <rect x="412" y="346" width="96" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.12"/>
  </g>
  <g>
    <rect x="368" y="394" width="214" height="60" rx="13" fill="#262422" stroke="#4E4A45"/>
    <circle cx="394" cy="424" r="7" fill="none" stroke="#C6A96A" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="412" y="413" width="76" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.34"/>
    <rect x="412" y="428" width="88" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.12"/>
  </g>

  <!-- converge -->
  <g fill="none" stroke="#CBB283" stroke-opacity="0.42" stroke-width="1.6">
    <path d="M582 96C650 96 650 260 706 260"/>
    <path d="M582 178C650 178 650 260 706 260"/>
    <path d="M582 260H706"/>
    <path d="M582 342C650 342 650 260 706 260"/>
    <path d="M582 424C650 424 650 260 706 260"/>
  </g>

  <!-- receipt -->
  <g>
    <rect x="706" y="186" width="126" height="148" rx="15" fill="#211F1D" stroke="url(#dc-champagne)" stroke-opacity="0.8"/>
    <rect x="726" y="210" width="60" height="7" rx="3.5" fill="#CBB283"/>
    <rect x="726" y="230" width="86" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="726" y="246" width="70" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="726" y="262" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.2"/>
    <path d="M726 286h86" stroke="#4E4A45" stroke-dasharray="4 4"/>
    <g transform="translate(726 298)">
      <rect width="6" height="8" rx="1.5" fill="#CBB283" fill-opacity="0.5"/>
      <rect x="9" width="6" height="13" rx="1.5" y="-5" fill="#CBB283" fill-opacity="0.75"/>
      <rect x="18" width="6" height="18" rx="1.5" y="-10" fill="#CBB283"/>
    </g>
    <circle cx="800" cy="300" r="11" fill="none" stroke="#7CC49A" stroke-width="2"/>
    <path d="M795.5 300l3.2 3.4 6.2-7" fill="none" stroke="#7CC49A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
