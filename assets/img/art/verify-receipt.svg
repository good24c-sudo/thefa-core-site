    <g transform="translate(28 346)">
      <rect width="274" height="34" rx="10" fill="#262422" stroke="#4E4A45"/>
      <rect x="16" y="14" width="150" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.26"/>
      <g transform="translate(228 10)">
        <rect y="8" width="5" height="6" rx="1.5" fill="#CBB283" fill-opacity="0.5"/>
        <rect x="8" y="4" width="5" height="10" rx="1.5" fill="#CBB283" fill-opacity="0.75"/>
        <rect x="16" width="5" height="14" rx="1.5" fill="#CBB283"/>
      </g>
    </g>
  </g>
</svg>
