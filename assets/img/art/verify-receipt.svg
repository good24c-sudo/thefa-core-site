<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="t-receipt">
  <title id="t-receipt">실행 종료와 검증 완료를 구분해 확인된 범위와 남은 조건을 함께 남기는 Receipt 기록 구조도</title>
  <defs>
    <linearGradient id="rc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EBD2"/>
      <stop offset="0.5" stop-color="#DEC99E"/>
      <stop offset="1" stop-color="#B99E6A"/>
    </linearGradient>
    <linearGradient id="rc-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#23211F"/>
      <stop offset="1" stop-color="#1B1A18"/>
    </linearGradient>
    <radialGradient id="rc-glow" cx="0.75" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#D6BE88" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D6BE88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="880" height="520" rx="22" fill="url(#rc-bg)"/>
  <rect width="880" height="520" rx="22" fill="url(#rc-grid)"/>
  <rect width="880" height="520" rx="22" fill="url(#rc-glow)"/>
  <rect x="0.5" y="0.5" width="879" height="519" rx="22" fill="none" stroke="#4E4A45" stroke-opacity="0.7"/>

  <!-- left: the four checks -->
  <g transform="translate(56 76)">
    <rect x="0" y="0" width="330" height="368" rx="18" fill="#211F1D" stroke="#38352F"/>
    <rect x="26" y="30" width="86" height="8" rx="4" fill="#CBB283"/>
    <path d="M26 58h278" stroke="#38352F"/>

    <g transform="translate(26 84)">
      <rect width="278" height="58" rx="12" fill="#2D2A28" stroke="#5FA97A" stroke-opacity="0.5"/>
      <circle cx="30" cy="29" r="11" fill="none" stroke="#7CC49A" stroke-width="2"/>
      <path d="M25 29l3.6 3.8 7-7.6" fill="none" stroke="#7CC49A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="54" y="18" width="104" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.46"/>
      <rect x="54" y="33" width="146" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="222" y="22" width="40" height="14" rx="7" fill="#7CC49A" fill-opacity="0.16"/>
