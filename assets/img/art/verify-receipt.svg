  </g>
  <path d="M452 254l8 6-8 6" fill="none" stroke="#CBB283" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right: receipt sheet -->
  <g transform="translate(482 60)">
    <rect x="12" y="14" width="330" height="400" rx="18" fill="#000000" fill-opacity="0.22"/>
    <rect x="0" y="0" width="330" height="400" rx="18" fill="#211F1D" stroke="url(#rc-gold)" stroke-opacity="0.85"/>

    <rect x="28" y="32" width="96" height="9" rx="4.5" fill="#CBB283"/>
    <rect x="28" y="52" width="150" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="236" y="28" width="66" height="22" rx="11" fill="none" stroke="#CBB283" stroke-opacity="0.6"/>
    <path d="M28 78h274" stroke="#38352F"/>

    <g transform="translate(28 96)">
      <rect width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3"/>
      <rect x="128" width="146" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
      <rect y="30" width="64" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3"/>
      <rect x="128" y="30" width="118" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
      <rect y="60" width="74" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3"/>
      <rect x="128" y="60" width="90" height="6" rx="3" fill="#CBB283" fill-opacity="0.65"/>
      <rect y="90" width="70" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3"/>
      <rect x="128" y="90" width="134" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
      <rect y="120" width="86" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3"/>
      <rect x="128" y="120" width="104" height="6" rx="3" fill="#C6A96A" fill-opacity="0.75"/>
    </g>

    <path d="M28 254h274" stroke="#38352F" stroke-dasharray="4 4"/>

    <!-- trail -->
    <g transform="translate(40 284)">
      <circle cx="0" cy="0" r="7" fill="#7CC49A"/>
      <path d="M62 0h-48" stroke="#4E4A45" stroke-width="1.6"/>
      <circle cx="76" cy="0" r="7" fill="#7CC49A"/>
      <path d="M138 0h-48" stroke="#4E4A45" stroke-width="1.6"/>
      <circle cx="152" cy="0" r="7" fill="#F4B223"/>
      <path d="M214 0h-48" stroke="#4E4A45" stroke-width="1.6" stroke-dasharray="3 4"/>
      <circle cx="228" cy="0" r="7" fill="none" stroke="#4E4A45" stroke-width="2"/>
      <rect x="-14" y="22" width="34" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.2"/>
      <rect x="62" y="22" width="30" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.2"/>
      <rect x="130" y="22" width="48" height="5" rx="2.5" fill="#CBB283" fill-opacity="0.55"/>
      <rect x="212" y="22" width="34" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.12"/>
