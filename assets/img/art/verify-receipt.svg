      <circle cx="30" cy="29" r="11" fill="none" stroke="#7CC49A" stroke-width="2"/>
      <path d="M25 29l3.6 3.8 7-7.6" fill="none" stroke="#7CC49A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="54" y="18" width="84" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.46"/>
      <rect x="54" y="33" width="128" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="222" y="22" width="40" height="14" rx="7" fill="#7CC49A" fill-opacity="0.16"/>
    </g>

    <g transform="translate(26 224)">
      <rect width="278" height="58" rx="12" fill="#302C24" stroke="#CBB283" stroke-opacity="0.72"/>
      <circle cx="30" cy="29" r="11" fill="none" stroke="#F4B223" stroke-width="2" stroke-dasharray="3.4 3.4"/>
      <circle cx="30" cy="29" r="3" fill="#F4B223"/>
      <rect x="54" y="18" width="118" height="7" rx="3.5" fill="#F0E4C8" fill-opacity="0.78"/>
      <rect x="54" y="33" width="96" height="6" rx="3" fill="#CBB283" fill-opacity="0.3"/>
      <rect x="222" y="22" width="40" height="14" rx="7" fill="#CBB283" fill-opacity="0.2"/>
    </g>

    <g transform="translate(26 294)">
      <rect width="278" height="58" rx="12" fill="#262422" stroke="#4E4A45"/>
      <circle cx="30" cy="29" r="11" fill="none" stroke="#C6A96A" stroke-width="2" stroke-dasharray="3 4"/>
      <rect x="54" y="18" width="98" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.3"/>
      <rect x="54" y="33" width="112" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.11"/>
      <rect x="222" y="22" width="40" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.07"/>
    </g>
  </g>

  <!-- bridge -->
  <g fill="none" stroke="#CBB283" stroke-opacity="0.4" stroke-width="1.6">
