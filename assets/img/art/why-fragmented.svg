<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t-why">
  <title id="t-why">도구마다 맥락이 끊기는 기존 방식과, 하나의 흐름으로 이어지는 THEFA Core 방식의 비교 도식</title>
  <defs>
    <linearGradient id="wy-bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3EE"/>
    </linearGradient>
    <linearGradient id="wy-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8A95F"/>
      <stop offset="1" stop-color="#8A6C2A"/>
    </linearGradient>
  </defs>

  <rect width="880" height="420" rx="20" fill="url(#wy-bg)"/>
  <rect x="0.5" y="0.5" width="879" height="419" rx="20" fill="none" stroke="#E0DCD3"/>
  <path d="M440 36v348" stroke="#E0DCD3" stroke-dasharray="5 6"/>

  <!-- LEFT: fragmented -->
  <g transform="translate(56 64)">
    <rect width="40" height="7" rx="3.5" fill="#8C877E"/>

    <g transform="translate(0 34)">
