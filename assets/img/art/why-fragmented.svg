      <rect x="46" y="38" width="84" height="6" rx="3" fill="#1A1815" fill-opacity="0.14"/>
    </g>
    <g transform="translate(174 34)">
      <rect width="150" height="68" rx="13" fill="#FFFFFF" stroke="#E0DCD3"/>
      <circle cx="26" cy="34" r="10" fill="#EDEAE3"/>
      <rect x="46" y="23" width="54" height="7" rx="3.5" fill="#1A1815" fill-opacity="0.42"/>
      <rect x="46" y="38" width="78" height="6" rx="3" fill="#1A1815" fill-opacity="0.14"/>
    </g>
    <g transform="translate(0 126)">
      <rect width="150" height="68" rx="13" fill="#FFFFFF" stroke="#E0DCD3"/>
      <circle cx="26" cy="34" r="10" fill="#EDEAE3"/>
      <rect x="46" y="23" width="70" height="7" rx="3.5" fill="#1A1815" fill-opacity="0.42"/>
      <rect x="46" y="38" width="66" height="6" rx="3" fill="#1A1815" fill-opacity="0.14"/>
    </g>
    <g transform="translate(174 126)">
      <rect width="150" height="68" rx="13" fill="#FFFFFF" stroke="#E0DCD3"/>
      <circle cx="26" cy="34" r="10" fill="#EDEAE3"/>
      <rect x="46" y="23" width="58" height="7" rx="3.5" fill="#1A1815" fill-opacity="0.42"/>
      <rect x="46" y="38" width="88" height="6" rx="3" fill="#1A1815" fill-opacity="0.14"/>
    </g>

    <!-- broken connectors -->
    <g stroke="#C9C4B8" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M150 68h8M166 68h8"/>
      <path d="M75 102v8M75 118v8"/>
      <path d="M249 102v8M249 118v8"/>
      <path d="M150 160h8M166 160h8"/>
    </g>
    <g stroke="#B0A48A" stroke-width="2.2" stroke-linecap="round">
      <path d="M156 60l10 16M166 60l-10 16" opacity="0.75"/>
      <path d="M156 152l10 16M166 152l-10 16" opacity="0.75"/>
    </g>

    <!-- repeated context -->
    <g transform="translate(0 220)" opacity="0.9">
      <rect width="324" height="52" rx="12" fill="#F5F3EE" stroke="#E0DCD3"/>
      <rect x="18" y="16" width="120" height="7" rx="3.5" fill="#1A1815" fill-opacity="0.26"/>
      <rect x="18" y="31" width="208" height="6" rx="3" fill="#1A1815" fill-opacity="0.12"/>
