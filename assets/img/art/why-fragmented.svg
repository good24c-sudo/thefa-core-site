      <path d="M-4 0l2.8 3 5.6-6" fill="none" stroke="#8A6C2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="28" y="-11" width="96" height="7" rx="3.5" fill="#1A1815" fill-opacity="0.5"/>
      <rect x="28" y="3" width="162" height="6" rx="3" fill="#1A1815" fill-opacity="0.14"/>
    </g>
    <g transform="translate(58 134)">
      <circle r="9" fill="#FFFFFF" stroke="#8A6C2A" stroke-width="2"/>
      <path d="M-4 0l2.8 3 5.6-6" fill="none" stroke="#8A6C2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="28" y="-11" width="118" height="7" rx="3.5" fill="#1A1815" fill-opacity="0.5"/>
      <rect x="28" y="3" width="138" height="6" rx="3" fill="#1A1815" fill-opacity="0.14"/>
    </g>
    <g transform="translate(58 196)">
      <circle r="9" fill="#C8A95F" stroke="#8A6C2A" stroke-width="2"/>
      <rect x="28" y="-11" width="80" height="7" rx="3.5" fill="#71561F"/>
      <rect x="28" y="3" width="150" height="6" rx="3" fill="#1A1815" fill-opacity="0.14"/>
    </g>
    <g transform="translate(58 238)">
      <circle r="9" fill="#FFFFFF" stroke="#C9C4B8" stroke-width="2" stroke-dasharray="3 3"/>
      <rect x="28" y="-11" width="104" height="7" rx="3.5" fill="#1A1815" fill-opacity="0.26"/>
      <rect x="28" y="3" width="120" height="6" rx="3" fill="#1A1815" fill-opacity="0.1"/>
    </g>

    <!-- receipt tag -->
    <g transform="translate(0 288)">
      <rect width="324" height="52" rx="12" fill="#F5F3EE" stroke="#C8A95F" stroke-opacity="0.6"/>
      <g transform="translate(20 18)">
        <rect y="10" width="5" height="6" rx="1.5" fill="#C8A95F"/>
        <rect x="8" y="5" width="5" height="11" rx="1.5" fill="#B08F43"/>
        <rect x="16" width="5" height="16" rx="1.5" fill="#8A6C2A"/>
      </g>
      <rect x="56" y="17" width="110" height="7" rx="3.5" fill="#71561F"/>
      <rect x="56" y="31" width="150" height="6" rx="3" fill="#1A1815" fill-opacity="0.14"/>
      <circle cx="288" cy="26" r="11" fill="none" stroke="#1F6B45" stroke-width="2"/>
      <path d="M283.5 26l3.2 3.4 6.2-7" fill="none" stroke="#1F6B45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
